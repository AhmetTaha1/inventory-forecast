# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3dc02fd3a9770fdcb8c9044cfd289cf3"
application_url = "https://example.com"
embedded = true
name = "inventory-forecast"

[access_scopes]
# Kod tabanında sadece tek bir salt-okuma GraphQL sorgusu var (sales.server.ts) —
# mutation hiç yok. Template'ten kalan write_products/write_orders/write_inventory
# kaldırıldı: hem kurulum ekranında gereksiz/korkutucu izin istemiyoruz hem de
# App Store incelemesinde kullanılmayan geniş izinler soru işareti yaratır.
scopes = "read_orders,read_all_orders,read_products,read_inventory,read_locations"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Shopify'ın App Store'a kabul için ZORUNLU tuttuğu 3 GDPR webhook'u —
  # bkz. app/routes/webhooks.compliance.tsx. Müşteri verisi tutmasak bile
  # gerekli; olmadan uygulama App Store'a hiç gönderilemez.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
